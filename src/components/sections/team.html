<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Team Page with Wave</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, system-ui, sans-serif;
}

/* PAGE */
body {
  background: #0b0b0b;
  color: #ffffff;
  height: 100vh;
  overflow: hidden;
}

/* LAYOUT */
.page {
  display: flex;
  width: 100vw;
  height: 100vh;
}

/* IMAGE AREA (75%) */
.image-frame {
  width: 75vw;
  height: 100vh;
  overflow: hidden;
}

.image-track {
  display: flex;
  height: 100%;
  transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1);
}

.image-track img {
  width: 75vw;
  height: 100vh;
  object-fit: cover;
  filter: grayscale(100%);
  flex-shrink: 0;
}

/* INFO AREA (25%) */
.info {
  width: 25vw;
  height: 100vh;
  padding: 70px 50px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #0b0b0b;
}

/* TEXT BLOCK */
.text {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.text.active {
  opacity: 1;
  transform: translateY(0);
}

.text h3 {
  font-size: 30px;
  font-weight: 300;
  margin-bottom: 10px;
}

.text p {
  font-size: 15px;
  line-height: 1.5;
  color: #cfcfcf;
  margin-bottom: 14px;
}

/* LINKS */
.links {
  display: flex;
  gap: 16px;
}

.links a {
  font-size: 14px;
  color: #aaaaaa;
  text-decoration: none;
  border-bottom: 1px dotted transparent;
}

.links a:hover {
  border-color: #aaaaaa;
}

/* WAVE */
.dot-wave {
  display: block;
}

.dots circle {
  fill: #ffffff;
  opacity: 0.8;
  animation: sineWave 1.5s linear infinite;
}

/* Phase shift = sine wave flow */
.dots circle:nth-child(1)  { animation-delay: 0s; }
.dots circle:nth-child(2)  { animation-delay: 0.15s; }
.dots circle:nth-child(3)  { animation-delay: 0.3s; }
.dots circle:nth-child(4)  { animation-delay: 0.45s; }
.dots circle:nth-child(5)  { animation-delay: 0.6s; }
.dots circle:nth-child(6)  { animation-delay: 0.75s; }
.dots circle:nth-child(7)  { animation-delay: 0.9s; }
.dots circle:nth-child(8)  { animation-delay: 1.05s; }
.dots circle:nth-child(9)  { animation-delay: 1.2s; }
.dots circle:nth-child(10) { animation-delay: 1.35s; }
.dots circle:nth-child(11) { animation-delay: 1.5s; }

/* SINE-LIKE MOTION */
@keyframes sineWave {
  0%   { transform: translateY(0); }
  10%{ transform: translateY(-10px); }
  20%{ transform: translateY(-20px); }
  25%{ transform: translateY(-30px); }
  30%{ transform: translateY(-20px); }
  40%{ transform: translateY(-10px); }
  50%{ transform: translateY(0px); }
  60%{ transform: translateY(10px); }
  70%{ transform: translateY(20px); }
  75%{ transform: translateY(30px); }
  80%{ transform: translateY(20px); }
  90%{ transform: translateY(10px); }
  100% { transform: translateY(0); }
}

</style>
</head>

<body>

<div class="page">

  <!-- IMAGE -->
  <div class="image-frame">
    <div class="image-track" id="imageTrack">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde">
      <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e">
      <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e">
      <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2">
    </div>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="text active" id="text">
      <h3 id="name">Elena Rossi</h3>
      <p id="role">Principal Architect focused on spatial clarity and restraint.</p>
      <div class="links">
        <a href="#">LinkedIn</a>
        <a href="#">GitHub</a>
      </div>
    </div>

    <!-- WAVE -->
    <svg class="dot-wave" width="280" height="60" viewBox="0 0 280 60">
      <g class="dots" id="dots">
        <circle cx="20"  cy="30" r="3"/>
        <circle cx="45"  cy="30" r="3"/>
        <circle cx="70"  cy="30" r="3"/>
        <circle cx="95"  cy="30" r="3"/>
        <circle cx="120" cy="30" r="3"/>
        <circle cx="145" cy="30" r="3"/>
        <circle cx="170" cy="30" r="3"/>
        <circle cx="195" cy="30" r="3"/>
        <circle cx="220" cy="30" r="3"/>
        <circle cx="245" cy="30" r="3"/>
        <circle cx="270" cy="30" r="3"/>
      </g>
    </svg>
  </div>

</div>

<script>
const images = document.getElementById("imageTrack");
const text = document.getElementById("text");
const nameEl = document.getElementById("name");
const roleEl = document.getElementById("role");
const dots = document.getElementById("dots");

const profiles = [
  {
    name: "Elena Rossi",
    role: "Principal Architect focused on spatial clarity and restraint."
  },
  {
    name: "Arjun Mehta",
    role: "Urban designer shaping human-scale environments."
  },
  {
    name: "Sofia Klein",
    role: "Interior architect working with light and material."
  },
  {
    name: "Lucas Moreau",
    role: "Project lead balancing form, cost, and craft."
  }
];

let index = 0;

setInterval(() => {
  index = (index + 1) % profiles.length;

  /* IMAGE PAGE TURN */
  images.style.transform = `translateX(-${index * 75}vw)`;

  /* TEXT CHANGE */
  text.classList.remove("active");
  setTimeout(() => {
    nameEl.textContent = profiles[index].name;
    roleEl.textContent = profiles[index].role;
    text.classList.add("active");
  }, 300);

  /* WAVE SYNC */
  dots.classList.remove("pulse");
  void dots.offsetWidth;
  dots.classList.add("pulse");

}, 2000);
</script>

</body>
</html>
